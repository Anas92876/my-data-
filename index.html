<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anas Al Homsi</title>
  <meta name="description" content="Anas Al Homsi, Software Engineer &amp; Full-Stack Developer. Portfolio, CV, GitHub and LinkedIn.">
  <meta name="theme-color" content="#0d0f14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14;
      --glow-1: rgba(99, 102, 241, .35);
      --glow-2: rgba(236, 72, 153, .22);
      --surface: rgba(255, 255, 255, .045);
      --surface-hover: rgba(255, 255, 255, .08);
      --border: rgba(255, 255, 255, .09);
      --border-hover: rgba(255, 255, 255, .22);
      --text: #f4f4f6;
      --muted: #9097a6;
      --accent: #a5b4fc;
      --primary-bg: #f4f4f6;
      --primary-text: #0d0f14;
      --online: #34d399;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f6f3;
        --glow-1: rgba(99, 102, 241, .18);
        --glow-2: rgba(236, 72, 153, .12);
        --surface: rgba(255, 255, 255, .7);
        --surface-hover: #ffffff;
        --border: rgba(15, 17, 25, .08);
        --border-hover: rgba(15, 17, 25, .2);
        --text: #12141b;
        --muted: #646b7a;
        --accent: #4f46e5;
        --primary-bg: #12141b;
        --primary-text: #ffffff;
        --online: #10b981;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(40px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Soft background glows */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 520px; height: 520px;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      pointer-events: none;
    }
    body::before { background: var(--glow-1); top: -220px; left: -160px; }
    body::after  { background: var(--glow-2); bottom: -240px; right: -180px; }

    /* Subtle dot grid */
    .grid {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }

    main { width: 100%; max-width: 400px; text-align: center; }

    /* Profile */
    .avatar-wrap {
      position: relative;
      width: 104px; height: 104px;
      margin: 0 auto 22px;
      padding: 3px;
      border-radius: 50%;
      background: conic-gradient(from 210deg, #6366f1, #ec4899, #f59e0b, #6366f1);
    }
    .avatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 3px solid var(--bg);
      background: var(--bg);
      display: grid; place-items: center;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 40px;
      color: var(--text);
      object-fit: cover;
      overflow: hidden;
    }
    .status {
      position: absolute; right: 6px; bottom: 6px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--online);
      border: 3px solid var(--bg);
    }

    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(38px, 11vw, 46px);
      line-height: 1.05;
      letter-spacing: -.01em;
    }
    h1 em { font-style: italic; color: var(--accent); }

    .role {
      margin-top: 10px;
      font-size: 15px;
      color: var(--muted);
    }

    .role .loc { font-size: 13.5px; opacity: .8; }

    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 18px;
      padding: 6px 12px;
      font-size: 12.5px; font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      backdrop-filter: blur(8px);
    }
    .pill i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 0 0 var(--online);
      animation: ping 2s infinite;
    }

    /* Links */
    nav { margin-top: 36px; display: grid; gap: 12px; }

    .link {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px 12px 12px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      text-decoration: none;
      text-align: left;
      transition: background .2s, border-color .2s, transform .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .link:hover, .link:focus-visible {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      outline: none;
    }
    .link:active { transform: scale(.985); }

    .icon {
      width: 44px; height: 44px; flex: none;
      display: grid; place-items: center;
      border-radius: 12px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
    }
    .icon svg { width: 21px; height: 21px; }

    .label { flex: 1; min-width: 0; }
    .label strong { display: block; font-size: 15.5px; font-weight: 600; }
    .label small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .arrow { width: 18px; height: 18px; color: var(--muted); flex: none; transition: transform .2s, color .2s; }
    .link:hover .arrow { transform: translateX(3px); color: var(--text); }
    .link.download:hover .arrow { transform: translateY(2px); }

    /* Primary (CV) */
    .link.primary {
      background: var(--primary-bg);
      border-color: transparent;
      color: var(--primary-text);
    }
    .link.primary .icon { background: rgba(127, 127, 127, .16); border-color: transparent; }
    .link.primary small, .link.primary .arrow { color: inherit; opacity: .65; }
    .link.primary:hover { background: var(--primary-bg); box-shadow: 0 10px 30px -10px var(--glow-1); }

    footer { margin-top: 40px; font-size: 12.5px; color: var(--muted); }

    /* Entrance animation */
    .rise { opacity: 0; transform: translateY(14px); animation: rise .7s cubic-bezier(.2, .7, .2, 1) forwards; }
    .d1 { animation-delay: .05s } .d2 { animation-delay: .12s } .d3 { animation-delay: .19s }
    .d4 { animation-delay: .28s } .d5 { animation-delay: .35s } .d6 { animation-delay: .42s }
    .d7 { animation-delay: .49s } .d8 { animation-delay: .6s }

    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--online) 60%, transparent); }
      80%, 100% { box-shadow: 0 0 0 7px transparent; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rise { opacity: 1; transform: none; animation: none; }
      .pill i { animation: none; }
      .link, .arrow { transition: none; }
    }
  </style>
</head>
